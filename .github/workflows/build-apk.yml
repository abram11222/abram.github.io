name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Android project
        run: |
          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          echo "===== CHECKING REQUIRED FILES ====="

          if [ ! -d "app" ]; then
            echo "ERROR: app directory is missing."
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts is missing."
            exit 1
          fi

          echo "Android project structure is OK."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deacon-Service-Management-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
