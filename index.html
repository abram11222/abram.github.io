<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة QR</title>
<style>
body{margin:0;font-family:Tahoma,Arial;background:#f2f2f2;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#fff;width:360px;padding:24px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
h2{text-align:center}
label{display:block;padding:10px;border:1px solid #ddd;border-radius:10px;margin:8px 0;cursor:pointer}
button{width:100%;padding:12px;border:none;border-radius:10px;background:#1e88e5;color:#fff;font-size:18px}
button:disabled{background:#888}
#message{text-align:center;font-size:20px;font-weight:bold;margin-top:15px}
#timer{text-align:center;color:#d32f2f;font-size:28px;margin-top:10px}
.success{background:#e8f5e9;border:2px solid #4caf50;border-radius:12px;padding:15px;margin-top:15px;color:#1b5e20}
</style>
</head>
<body>
<div class="card">
<h2>ما هو الرقم الصحيح؟</h2>

<label><input type="radio" name="q" value="1"> ١</label>
<label><input type="radio" name="q" value="2"> ٢</label>
<label><input type="radio" name="q" value="3"> ٣</label>
<label><input type="radio" name="q" value="4"> ٤</label>

<button id="submitBtn" onclick="check()">إرسال</button>

<div id="message"></div>
<div id="timer"></div>
</div>
<script>
const QR_MESSAGE = "📍 الـ QR الثاني موجود في المكان: (اكتب المكان هنا)";

const saved = localStorage.getItem("quizTimer");
if(saved) startCountdown(parseInt(saved));

function check(){
 let ans=document.querySelector('input[name="q"]:checked');
 if(!ans){alert("اختر إجابة أولاً");return;}

 if(ans.value==="2"){
   document.getElementById("message").innerHTML =
   '<div class="success">✅ إجابة صحيحة<br><br>'+QR_MESSAGE+'</div>';
   document.getElementById("submitBtn").style.display="none";
   document.getElementById("timer").innerHTML="";
   localStorage.removeItem("quizTimer");
 }else{
   document.getElementById("message").innerHTML="❌ إجابة خاطئة";
   let end=Date.now()+60000;
   localStorage.setItem("quizTimer",end);
   startCountdown(end);
 }
}

function startCountdown(end){
 document.getElementById("submitBtn").disabled=true;
 let t=setInterval(function(){
   let diff=end-Date.now();
   if(diff<=0){
     clearInterval(t);
     document.getElementById("submitBtn").disabled=false;
     document.getElementById("timer").innerHTML="";
     localStorage.removeItem("quizTimer");
     return;
   }
   document.getElementById("timer").innerHTML="⏳ حاول مرة أخرى بعد "+Math.ceil(diff/1000)+" ثانية";
 },250);
}
</script>
</body>
</html>
