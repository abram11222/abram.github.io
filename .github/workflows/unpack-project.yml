name: Unpack Project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/unpack-project.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf /tmp/deacon
          mkdir -p /tmp/deacon

          unzip -q "$ZIP_FILE" -d /tmp/deacon

          ROOT=$(find /tmp/deacon -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ]; then
            cp -a "$ROOT"/. .
          else
            cp -a /tmp/deacon/. .
          fi

          rm -f ./*.zip

      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack Deacon Service project"
            git push
          fi
