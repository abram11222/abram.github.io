name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        run: |
          echo "Project root:"
          pwd

          echo "Files:"
          ls -la

          echo "Checking Android project..."

          test -d app
          test -f settings.gradle.kts

          echo "Android project detected successfully."

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            find app/build -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "APK is empty."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deacon-Service-Management-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
