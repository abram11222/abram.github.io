name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. التأكد من شكل المشروع
      - name: Verify Project
        shell: bash
        run: |
          echo "===== PROJECT ROOT ====="
          pwd
          echo "===== FILES ====="
          ls -la

          test -d app || {
            echo "ERROR: app folder not found"
            exit 1
          }

          test -f settings.gradle.kts || {
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          }

          test -f build.gradle.kts || {
            echo "ERROR: build.gradle.kts not found"
            exit 1
          }

          echo "Project structure is OK."

      # 5. إنشاء الملف المطلوب بواسطة Secrets Gradle Plugin
      - name: Create .env.example
        shell: bash
        run: |
          cat > .env.example <<'EOF'
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          EOF

          echo ".env.example created successfully."
          ls -la .env.example

      # 6. تثبيت Gradle
      # المشروع الحالي لا يحتوي على gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # 7. Build
      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # 8. التأكد أن الـ APK اتعمل فعلاً
      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Searching for APK files..."
            find . -type f -name "*.apk" -print
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo "======================================"
          echo "       APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh "$APK"

      # 9. رفع الـ APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deacon-Service-Management-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
