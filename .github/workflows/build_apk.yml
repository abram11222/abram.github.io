name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android Project
        shell: bash
        run: |
          echo "======================================"
          echo "Checking Android project..."
          echo "======================================"

          pwd
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts not found."
            exit 1
          fi

          echo "Android project structure OK."

      - name: Create .env.example
        shell: bash
        run: |
          cat > .env.example <<'EOF'
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          EOF

          echo ".env.example created successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "Android SDK detected."

      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Searching for APK files:"
            find . -type f -name "*.apk" -print

            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          echo "======================================"
          echo "       APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deacon-Service-Management-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
