name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android Project
        run: |
          echo "Checking Android project..."

          test -d app || exit 1
          test -f settings.gradle.kts || exit 1
          test -f build.gradle.kts || exit 1

          echo "Android project OK."

      - name: Create .env.example
        run: |
          printf '%s\n' \
            'SUPABASE_URL=' \
            'SUPABASE_ANON_KEY=' \
            > .env.example

          echo ".env.example created."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find . -type f -name "*.apk" -print
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deacon-Service-Management-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
