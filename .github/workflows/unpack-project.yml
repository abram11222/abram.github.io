name: Unpack Deacon Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "ZIP found: $ZIP"

          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project

      - name: Find Android project
        run: |
          PROJECT=$(find /tmp/project -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            find /tmp/project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project found: $PROJECT"

          cp -a "$PROJECT"/. .

      - name: Remove ZIP
        run: |
          rm -f ./*.zip

      - name: Verify project
        run: |
          echo "===== PROJECT STRUCTURE ====="
          ls -la

          echo "===== REQUIRED FILES ====="

          test -d app
          test -f settings.gradle.kts
          test -f build.gradle.kts

          echo "APP FOUND"
          echo "SETTINGS FOUND"
          echo "BUILD GRADLE FOUND"

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install Deacon Service project"
            git push
          fi
